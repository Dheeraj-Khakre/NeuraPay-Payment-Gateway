
spring:
  datasource:
    url: jdbc:sqlite:./data/dev.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

vault:
  master-key: 234jckefj3ewfjic3ewifjc3eijijewicw
payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: normal

    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90

      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 4
        success-rate: 95

      NET_BANKING:
        min-delay-seconds: 1
        max-delay-seconds: 8
        success-rate: 80

      WALLET:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 90
        
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:2uh9rhf3uwhf38uhfn83euihfnc834eriudhfcn834ure}
    access-token-expiration: PT15M